// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Declared here, not in variables.gradle: that file is applied further down,
    // after this block has already been evaluated.
    ext.kotlinVersion = '2.4.10'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'io.sentry:sentry-android-gradle-plugin:4.14.1'
        // Kotlin + the Compose compiler are here for the Glance app widget only —
        // the Capacitor app itself is still Java. Both must stay on the same
        // version; the Compose plugin is versioned in lockstep with Kotlin.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
