<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — The Storm Watcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #0d1b2a 0%, #0a0a1a 60%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #94a3b8;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    svg { opacity: 0.4; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #e2e8f0; }
    p { font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
    button {
      margin-top: 0.5rem;
      padding: 0.65rem 1.75rem;
      border-radius: 0.75rem;
      border: none;
      background: linear-gradient(to right, #10b981, #059669);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1l22 22"/>
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
    <circle cx="12" cy="20" r="1"/>
  </svg>
  <h1>You're offline</h1>
  <p>No internet connection. Cached data may still be available on the main pages.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
