<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Нощно небе: по-светло в центъра, тъмнее към ръбовете -->
    <radialGradient id="sky" cx="50%" cy="46%" r="72%">
      <stop offset="0%"  stop-color="#1e2548"/>
      <stop offset="55%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </radialGradient>

    <!-- Слънчев диск: горещо златно ядро, преливащо към оранжев ръб -->
    <radialGradient id="sun" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="55%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <!-- Aurora лента: оранжево в основата -> емералд на върха -->
    <linearGradient id="aurora" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="45%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Меко сияние около слънцето -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g><circle cx="210" cy="250" r="3.0" fill="#cbd5f5" opacity="0.7"/>
    <circle cx="300" cy="180" r="2.0" fill="#cbd5f5" opacity="0.5"/>
    <circle cx="820" cy="240" r="3.2" fill="#cbd5f5" opacity="0.7"/>
    <circle cx="760" cy="360" r="2.0" fill="#cbd5f5" opacity="0.45"/>
    <circle cx="180" cy="540" r="2.4" fill="#cbd5f5" opacity="0.5"/>
    <circle cx="860" cy="600" r="2.6" fill="#cbd5f5" opacity="0.55"/>
    <circle cx="250" cy="760" r="2.2" fill="#cbd5f5" opacity="0.5"/>
    <circle cx="790" cy="800" r="3.0" fill="#cbd5f5" opacity="0.6"/>
    <circle cx="520" cy="150" r="2.2" fill="#cbd5f5" opacity="0.5"/>
    <circle cx="660" cy="720" r="1.8" fill="#cbd5f5" opacity="0.4"/></g>
  <g transform="translate(81.9 81.9) scale(0.8400)">
    <path d="M 298.96 499.22 A 224.00 224.00 0 0 0 725.04 499.22" fill="none" stroke="url(#aurora)" stroke-width="50" stroke-linecap="round" opacity="0.95"/>
    <path d="M 227.69 581.17 A 322.00 322.00 0 0 0 796.31 581.17" fill="none" stroke="url(#aurora)" stroke-width="42" stroke-linecap="round" opacity="0.7"/>
    <path d="M 193.33 697.40 A 416.00 416.00 0 0 0 830.67 697.40" fill="none" stroke="url(#aurora)" stroke-width="32" stroke-linecap="round" opacity="0.45"/>
    <circle cx="512" cy="430" r="212" fill="url(#halo)" filter="url(#soft)"/>
    <circle cx="512" cy="430" r="142" fill="url(#sun)"/>
    <path d="M 500.15 294.52 A 136.00 136.00 0 0 0 376.52 418.15" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>